<div class="country-list-container">

  <div class="controls">
    <div class="search-wrapper">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearch()"
        placeholder="Search for a country..."
      />
      <button (click)="onSearch()" aria-label="Search">
        <i class="fa fa-search"></i>
      </button>
    </div>
    
    <div class="filter-wrapper">
      <select 
        [(ngModel)]="selectedRegion" 
        (change)="onRegionChange()"
        class="region-select"
      >
        <option value="">Filter by Region</option>
        <option *ngFor="let region of regions" [value]="region">{{ region }}</option>
      </select>
    </div>
  </div>

  <div *ngIf="loading$ | async" class="loading">
    Loading countries...
  </div>

  <div *ngIf="!(loading$ | async)" class="countries-grid">
    <div 
      *ngFor="let country of filteredCountries$ | async" 
      class="card"
      (click)="onCountryClick(country)"
    >
      <img [src]="country.flags.png" [alt]="country.name.common + ' flag'" class="flag" />
      <div class="details">
        <h2 class="name">{{ country.name.common }}</h2>
        <p><strong>Population:</strong> {{ country.population | number }}</p>
        <p><strong>Region:</strong> {{ country.region }}</p>
        <p><strong>Capital:</strong> {{ country.capital?.[0] || 'N/A' }}</p>
      </div>
    </div>
  </div>
</div>
